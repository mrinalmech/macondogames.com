name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/macondogames
        run: |
          docker build \
            --secret id=SANITY_API_READ_TOKEN,env=SANITY_API_READ_TOKEN \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Roll out the service
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/macondogames:${{ github.sha }}
        run: |
          aws ecs update-express-gateway-service \
            --region ap-south-1 \
            --service-arn arn:aws:ecs:ap-south-1:761097097259:service/default/macondogames \
            --primary-container "$(jq -n \
              --arg image "$IMAGE" \
              --arg token "$SANITY_API_READ_TOKEN" \
              '{image:$image,containerPort:3000,environment:[{name:"SANITY_API_READ_TOKEN",value:$token}]}')"
